
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10131b">
<title>PRO AUDIO MASTER ACADEMY</title>
<style>
:root {
  --bg:#0b0e14;
  --panel:#141a25;
  --panel2:#1b2432;
  --line:#293548;
  --red:#e60025;
  --blue:#38bdf8;
  --gold:#e5c07b;
  --green:#22c55e;
  --text:#edf2f7;
  --muted:#9ba9bb;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,Tahoma,sans-serif;line-height:1.7;
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:14px 22px;background:#101722;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:43px;height:43px;border-radius:12px;
  display:grid;place-items:center;background:var(--red);
  font-weight:900;font-size:20px;
}
.brand h1{font-size:16px;margin:0;letter-spacing:.5px}
.brand small{display:block;color:var(--muted);font-size:11px}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{
  border:1px solid var(--line);background:var(--panel2);
  color:var(--text);padding:9px 13px;border-radius:9px;
}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--red);border-color:var(--red)}
.btn.gold{background:var(--gold);color:#171717;border-color:var(--gold)}
.layout{display:grid;grid-template-columns:245px 1fr;flex:1}
.sidebar{
  background:#101722;border-left:1px solid var(--line);
  padding:18px 12px;min-height:calc(100vh - 72px);
}
.nav-title{font-size:11px;color:var(--muted);padding:12px 10px 5px}
.nav-btn{
  display:flex;width:100%;gap:10px;align-items:center;
  border:0;background:transparent;color:#c5d0df;
  padding:11px 12px;border-radius:9px;text-align:start;margin:3px 0;
}
.nav-btn:hover,.nav-btn.active{background:#202b3b;color:white}
.nav-btn.active{border-right:3px solid var(--red)}
.main{padding:25px;max-width:1500px;width:100%;margin:auto}
.hero{
  padding:30px;border:1px solid var(--line);border-radius:18px;
  background:radial-gradient(circle at 85% 10%,#25344a 0,transparent 38%),
  linear-gradient(135deg,#171e2b,#111722);
}
.eyebrow{color:var(--gold);font-size:12px;font-weight:bold}
.hero h2{font-size:clamp(24px,4vw,39px);line-height:1.3;margin:10px 0}
.hero p{color:var(--muted);max-width:760px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.section-head{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin:27px 0 14px;
}
.section-head h2,.section-head h3{margin:0}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:18px;min-width:0;
}
.card h3{margin:4px 0 8px;font-size:17px}
.card p{color:var(--muted);font-size:13px}
.card .icon{font-size:25px}
.card-action{margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.stat{background:#111925;border:1px solid var(--line);padding:15px;border-radius:12px}
.stat strong{display:block;font-size:25px;color:var(--gold)}
.stat span{font-size:12px;color:var(--muted)}
.progress-track{height:8px;background:#273244;border-radius:20px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);width:0%;transition:width .3s}
.list{display:grid;gap:10px}
.lesson-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;
}
.lesson-row small{color:var(--muted);display:block}
.tag{font-size:11px;padding:4px 8px;border-radius:20px;background:#243348;color:var(--blue)}
.lesson-content{max-width:900px}
.lesson-content h2{font-size:27px}
.lesson-content p{color:#d2dbe7}
.lesson-content li{margin:8px 0}
.callout{border-right:3px solid var(--gold);background:#211f1a;padding:13px 16px;border-radius:8px;margin:15px 0}
.quiz-option{
  display:block;width:100%;text-align:start;padding:12px;
  border:1px solid var(--line);background:var(--panel2);
  color:var(--text);border-radius:9px;margin:8px 0;
}
.quiz-option.selected{border-color:var(--blue);background:#183044}
.quiz-option.correct{border-color:var(--green)}
.quiz-option.wrong{border-color:var(--red)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type="range"]{accent-color:var(--red)}
select{
  color:var(--text);background:var(--panel2);
  border:1px solid var(--line);padding:9px;border-radius:8px;
}
.lab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.channel{
  background:#171d27;border:1px solid #384354;border-radius:13px;
  padding:14px;text-align:center;
}
.channel h3{font-size:14px;margin:0 0 8px}
.knob{
  width:62px;height:62px;border:5px solid #4a5667;
  border-top-color:var(--gold);border-radius:50%;
  margin:8px auto;display:grid;place-items:center;
  background:#10151d;font-weight:bold;font-size:12px;
}
.control{margin:12px 0;text-align:start}
.control label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.control input{width:100%}
.meter{height:13px;background:#0a0d12;border-radius:5px;overflow:hidden;margin:10px 0}
.meter-fill{height:100%;width:0%;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444)}
.signal-box{
  background:#101722;border:1px solid var(--line);padding:16px;
  border-radius:12px;margin-top:15px;
}
.signal-flow{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.signal-node{background:#243348;padding:8px 11px;border-radius:7px;font-size:12px}
.signal-arrow{color:var(--gold)}
.footer{padding:18px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
.hidden{display:none!important}
.empty{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:950px){
  .layout{grid-template-columns:1fr}
  .sidebar{min-height:auto;display:flex;overflow-x:auto;gap:5px;padding:8px}
  .nav-title{display:none}
  .nav-btn{white-space:nowrap;width:auto;min-width:max-content}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:600px){
  .topbar{padding:10px}
  .brand h1{font-size:12px}
  .brand small{font-size:9px}
  .main{padding:14px}
  .hero{padding:20px}
  .grid,.stats{grid-template-columns:1fr 1fr}
  .lab-grid{grid-template-columns:1fr}
  .top-actions .btn{padding:7px 9px;font-size:12px}
  .lesson-row{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">
    <div class="logo">PA</div>
    <div>
      <h1>PRO AUDIO MASTER ACADEMY</h1>
      <small id="brandSubtitle">أكاديمية هندسة الصوت الاحترافية</small>
    </div>
  </div>
  <div class="top-actions">
    <button class="btn" id="languageButton" onclick="toggleLanguage()">EN</button>
    <button class="btn" onclick="resetProgress()" id="resetButton">إعادة التقدم</button>
  </div>
</header>

<div class="layout">
<aside class="sidebar" id="sidebar">
  <div class="nav-title" data-ar="الأكاديمية" data-en="ACADEMY">الأكاديمية</div>
  <button class="nav-btn active" data-page="dashboard" onclick="navigate('dashboard')">🏠 <span data-ar="الرئيسية" data-en="Dashboard">الرئيسية</span></button>
  <button class="nav-btn" data-page="curriculum" onclick="navigate('curriculum')">📚 <span data-ar="المناهج" data-en="Curriculum">المناهج</span></button>
  <button class="nav-btn" data-page="levels" onclick="navigate('levels')">🎓 <span data-ar="المستويات" data-en="Levels">المستويات</span></button>
  <div class="nav-title" data-ar="التدريب العملي" data-en="PRACTICE">التدريب العملي</div>
  <button class="nav-btn" data-page="lab" onclick="navigate('lab')">🎛️ <span data-ar="مختبر المكسر" data-en="Mixer Lab">مختبر المكسر</span></button>
  <button class="nav-btn" data-page="events" onclick="navigate('events')">🎤 <span data-ar="تشغيل الفعاليات" data-en="Live Events">تشغيل الفعاليات</span></button>
  <button class="nav-btn" data-page="engineering" onclick="navigate('engineering')">🔊 <span data-ar="هندسة الأنظمة" data-en="System Engineering">هندسة الأنظمة</span></button>
  <div class="nav-title" data-ar="التقييم" data-en="ASSESSMENT">التقييم</div>
  <button class="nav-btn" data-page="progress" onclick="navigate('progress')">📈 <span data-ar="إنجازاتي" data-en="My Progress">إنجازاتي</span></button>
</aside>

<main class="main" id="pageContent"></main>
</div>
<footer class="footer">PRO AUDIO MASTER ACADEMY · Learn · Practice · Engineer · Perform</footer>
</div>

<script>
"use strict";

/* =========================
   1. LANGUAGE AND STORAGE
========================= */
const STORAGE_KEY = "proAudioAcademy_v1";
const defaultState = {
  language:"ar",
  completed:[],
  scores:{},
  attempts:{},
  mixer:{
    gain:0, high:0, mid:0, low:0, aux:0, fader:0
  }
};
let state = loadState();
let currentPage = "dashboard";
let currentLessonId = null;
let quizAnswers = {};

function loadState(){
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return saved ? {...defaultState,...saved,mixer:{...defaultState.mixer,...saved.mixer}} : {...defaultState};
  } catch(e){ return {...defaultState}; }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}
function t(ar,en){ return state.language==="ar" ? ar : en; }
function esc(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function toggleLanguage(){
  state.language = state.language==="ar" ? "en" : "ar";
  saveState();
  applyLanguage();
  render();
}
function applyLanguage(){
  const ar = state.language==="ar";
  document.documentElement.lang = ar ? "ar" : "en";
  document.documentElement.dir = ar ? "rtl" : "ltr";
  document.getElementById("languageButton").textContent = ar ? "EN" : "عربي";
  document.getElementById("resetButton").textContent = ar ? "إعادة التقدم" : "Reset Progress";
  document.getElementById("brandSubtitle").textContent = ar
    ? "أكاديمية هندسة الصوت الاحترافية"
    : "Professional Audio Engineering Academy";
  document.querySelectorAll("[data-ar][data-en]").forEach(el=>{
    el.textContent = ar ? el.dataset.ar : el.dataset.en;
  });
}
function resetProgress(){
  if(!confirm(t("هل تريد حذف تقدمك ونتائجك المحفوظة على هذا الجهاز؟","Delete your saved progress and scores on this device?"))) return;
  state.completed=[];
  state.scores={};
  state.attempts={};
  saveState();
  render();
}

/* =========================
   2. CURRICULUM DATABASE
========================= */
const colleges = [
 {id:"foundation",icon:"🌊",ar:"أساسيات الصوت",en:"Audio Foundations",descAr:"الصوت والموجات والتردد والسعة والديسيبل.",descEn:"Sound waves, frequency, amplitude and decibels."},
 {id:"microphones",icon:"🎙️",ar:"الميكروفونات",en:"Microphones",descAr:"أنواع الميكروفونات والأنماط القطبية والتوصيل.",descEn:"Microphone types, polar patterns and connections."},
 {id:"analog",icon:"🎚️",ar:"المكسرات التناظرية",en:"Analog Mixers",descAr:"فهم القنوات وGain وEQ وAux وBus.",descEn:"Channels, gain, EQ, aux sends and buses."},
 {id:"dynacord",icon:"🔴",ar:"Dynacord CMS وPowerMate",en:"Dynacord CMS & PowerMate",descAr:"التدريب على مكسرات Dynacord وفق موديلها ودليلها.",descEn:"Model-specific Dynacord training based on official manuals."},
 {id:"processing",icon:"🎛️",ar:"معالجة الصوت",en:"Audio Processing",descAr:"Equalizer وCompressor وGate وEffects.",descEn:"Equalizers, compressors, gates and effects."},
 {id:"digital",icon:"💻",ar:"المكسرات الرقمية",en:"Digital Mixers",descAr:"الطبقات والمشاهد والتوجيه والمعالجة الرقمية.",descEn:"Layers, scenes, routing and digital processing."},
 {id:"speakers",icon:"🔊",ar:"السماعات ومكبرات القدرة",en:"Speakers & Amplifiers",descAr:"الممانعة والقدرة والتوصيل والتغطية.",descEn:"Impedance, power, wiring and coverage."},
 {id:"systems",icon:"📐",ar:"هندسة الأنظمة الصوتية",en:"Sound System Engineering",descAr:"اختيار الأنظمة وتوزيع السماعات وحسابات SPL.",descEn:"System selection, loudspeaker layouts and SPL."},
 {id:"acoustics",icon:"🏛️",ar:"الصوتيات المعمارية",en:"Room Acoustics",descAr:"الانعكاس والصدى والامتصاص والمعالجة.",descEn:"Reflections, reverberation, absorption and treatment."},
 {id:"live",icon:"🎤",ar:"تشغيل الفعاليات",en:"Live Sound & Events",descAr:"الحفلات والمؤتمرات والمسارح والبث.",descEn:"Concerts, conferences, stages and broadcast."},
 {id:"venues",icon:"🕌",ar:"القاعات والمساجد",en:"Venues & Mosques",descAr:"تصميم أنظمة المساجد والقاعات والمنشآت.",descEn:"Mosques, halls and venue sound systems."},
 {id:"network",icon:"🌐",ar:"الصوت عبر الشبكات",en:"Network Audio",descAr:"Dante وAES67 والشبكات الصوتية.",descEn:"Dante, AES67 and networked audio."}
];

const lessons = [
{
 id:"F001",college:"foundation",level:1,duration:20,
 ar:"ما هو الصوت؟",en:"What Is Sound?",
 bodyAr:[
  "الصوت اضطراب ميكانيكي ينتقل خلال وسط مادي مثل الهواء أو الماء أو المواد الصلبة. لا ينتقل الصوت في الفراغ بالطريقة التي ينتقل بها الضوء.",
  "تبدأ السلسلة الصوتية عندما يهتز مصدر ما، فيحدث تغيراً في ضغط الوسط المحيط، ثم يصل هذا التغير إلى الأذن أو الميكروفون.",
  "في أنظمة الصوت نستخدم الميكروفون لتحويل تغير الضغط إلى إشارة كهربائية، ثم نعالج الإشارة ونضخمها ونحوّلها إلى صوت عبر السماعة."
 ],
 bodyEn:[
  "Sound is a mechanical disturbance travelling through a medium such as air, water or solids. It does not travel through a vacuum like light.",
  "A vibrating source creates pressure variations in the surrounding medium. These variations reach the ear or a microphone.",
  "In audio systems, a microphone converts pressure variations into an electrical signal, which is processed, amplified and reproduced by a loudspeaker."
 ],
 objectivesAr:["تعريف الصوت كموجة ميكانيكية.","شرح دور الميكروفون والسماعة.","تمييز المصدر والوسط والمستقبل."],
 objectivesEn:["Define sound as a mechanical wave.","Explain microphone and loudspeaker roles.","Identify source, medium and receiver."],
 quiz:[
  {qAr:"أي مما يلي يحتاجه الصوت للانتقال؟",qEn:"What does sound need to travel?",optionsAr:["وسط مادي","فراغ تام","ضوء"],optionsEn:["A physical medium","A perfect vacuum","Light"],answer:0,whyAr:"الصوت موجة ميكانيكية تحتاج إلى وسط مادي.",whyEn:"Sound is a mechanical wave and requires a medium."},
  {qAr:"ما وظيفة الميكروفون؟",qEn:"What does a microphone do?",optionsAr:["تحويل الصوت إلى إشارة كهربائية","زيادة مساحة القاعة","توليد الكهرباء"],optionsEn:["Convert sound into an electrical signal","Increase room size","Generate electricity"],answer:0,whyAr:"الميكروفون يحول التغيرات الصوتية إلى إشارة كهربائية.",whyEn:"A microphone converts acoustic variations into an electrical signal."}
 ]
},
{
 id:"F002",college:"foundation",level:1,duration:25,
 ar:"التردد والطول الموجي",en:"Frequency & Wavelength",
 bodyAr:[
  "التردد هو عدد الدورات الكاملة للموجة في الثانية، ووحدته الهرتز Hz.",
  "التردد المنخفض يرتبط عادةً بالإحساس بالجهير، والتردد المرتفع يرتبط بالإحساس بالحدة. هذا وصف إدراكي عام وليس بديلاً عن قياس الاستجابة.",
  "العلاقة الأساسية: سرعة الصوت = التردد × الطول الموجي. في الهواء عند درجة حرارة الغرفة يمكن استخدام 343 متر/ثانية كتقريب."
 ],
 bodyEn:[
  "Frequency is the number of complete cycles per second, measured in hertz (Hz).",
  "Lower frequencies are generally perceived as bass and higher frequencies as treble. This is a broad perceptual description, not a substitute for measurement.",
  "The basic relationship is: speed of sound = frequency × wavelength. Around room temperature, 343 m/s is a useful approximation in air."
 ],
 objectivesAr:["تعريف التردد.","معرفة وحدة Hz.","استخدام العلاقة بين السرعة والتردد والطول الموجي."],
 objectivesEn:["Define frequency.","Know the Hz unit.","Use the speed-frequency-wavelength relationship."],
 quiz:[
  {qAr:"ما وحدة قياس التردد؟",qEn:"What is the unit of frequency?",optionsAr:["Hz","Watt","Ohm"],optionsEn:["Hz","Watt","Ohm"],answer:0,whyAr:"يقاس التردد بالهرتز.",whyEn:"Frequency is measured in hertz."}
 ]
},
{
 id:"F003",college:"foundation",level:1,duration:25,
 ar:"الديسيبل ومستويات الصوت",en:"Decibels & Sound Levels",
 bodyAr:[
  "الديسيبل dB وحدة لوغاريتمية للتعبير عن النسب. يجب دائماً معرفة المرجع المستخدم: dB SPL أو dBu أو dBV أو dBFS وغيرها.",
  "لا يجوز مقارنة قراءة dBFS الرقمية مباشرة بقراءة dB SPL في القاعة دون معرفة معايرة النظام.",
  "زيادة 6 dB في مستوى ضغط الصوت تقابل تقريباً مضاعفة ضغط الصوت، بينما زيادة 10 dB تقابل عشرة أضعاف القدرة الصوتية في شروط المقارنة المناسبة."
 ],
 bodyEn:[
  "The decibel (dB) is a logarithmic way to express ratios. Always identify the reference: dB SPL, dBu, dBV, dBFS and others.",
  "A digital dBFS reading cannot be directly compared with room dB SPL without system calibration.",
  "A 6 dB increase is approximately a doubling of sound pressure, while 10 dB corresponds to ten times the power ratio under the relevant comparison conditions."
 ],
 objectivesAr:["تمييز أنواع قياس الديسيبل.","فهم الطبيعة اللوغاريتمية.","عدم الخلط بين dBFS وdB SPL."],
 objectivesEn:["Distinguish decibel references.","Understand logarithmic behaviour.","Avoid confusing dBFS with dB SPL."],
 quiz:[
  {qAr:"أي قراءة تستخدم لقياس مستوى ضغط الصوت في القاعة؟",qEn:"Which unit is used for acoustic sound pressure level?",optionsAr:["dB SPL","dBFS","dBu"],optionsEn:["dB SPL","dBFS","dBu"],answer:0,whyAr:"dB SPL مرجعه ضغط الصوت في الهواء.",whyEn:"dB SPL references acoustic pressure in air."}
 ]
},
{
 id:"M001",college:"microphones",level:2,duration:30,
 ar:"أنواع الميكروفونات",en:"Microphone Types",
 bodyAr:[
  "الميكروفونات الديناميكية Dynamic شائعة في الاستخدام الحي وتتحمل ظروف العمل القاسية غالباً.",
  "الميكروفونات المكثفة Condenser تحتاج عادةً إلى تغذية Phantom Power مناسبة، مثل 48V، وفق مواصفات الميكروفون.",
  "اختيار الميكروفون لا يعتمد على النوع فقط؛ بل على المصدر الصوتي، الحساسية، نمط الالتقاط، البيئة، ومقدار الرفض خارج المحور."
 ],
 bodyEn:[
  "Dynamic microphones are common in live sound and are often robust in demanding environments.",
  "Condenser microphones typically require suitable phantom power, often 48V, according to the microphone specifications.",
  "Selection depends on the source, sensitivity, polar pattern, environment and off-axis rejection—not type alone."
 ],
 objectivesAr:["التمييز بين Dynamic وCondenser.","فهم Phantom Power.","اختيار الميكروفون وفق التطبيق."],
 objectivesEn:["Differentiate dynamic and condenser microphones.","Understand phantom power.","Select a microphone for the application."],
 quiz:[
  {qAr:"أي نوع يحتاج غالباً إلى Phantom Power؟",qEn:"Which type commonly requires phantom power?",optionsAr:["Condenser","Dynamic دائماً","Passive speaker"],optionsEn:["Condenser","Always dynamic","Passive speaker"],answer:0,whyAr:"كثير من ميكروفونات Condenser تحتاج إلى تغذية فانتوم.",whyEn:"Many condenser microphones require phantom power."}
 ]
},
{
 id:"A001",college:"analog",level:2,duration:35,
 ar:"تشريح قناة المكسر التناظري",en:"Anatomy of an Analog Mixer Channel",
 bodyAr:[
  "قناة المكسر تستقبل مصدراً صوتياً عبر مدخل Mic أو Line وفق نوع الإشارة.",
  "Gain أو Trim يضبط مستوى الإشارة الداخلة إلى القناة. لا تستخدمه كبديل عن خفض Fader أو التحكم في مستوى السماعة.",
  "EQ يغير التوازن الترددي، وAux يرسل نسخة من الإشارة إلى مسار آخر مثل Monitor أو Effects بحسب تصميم المكسر.",
  "القناة تصل في النهاية إلى Bus أو Main Mix وفق التوجيه Routing."
 ],
 bodyEn:[
  "A mixer channel receives a source through a Mic or Line input, depending on the signal type.",
  "Gain or Trim sets the input stage level. It is not a substitute for channel fader or loudspeaker level control.",
  "EQ changes frequency balance. Aux sends a signal to another path such as a monitor or effects bus, depending on the mixer design.",
  "The channel eventually reaches a bus or main mix through routing."
 ],
 objectivesAr:["معرفة وظائف Gain وEQ وAux وFader.","فهم مسار الإشارة.","التمييز بين مستوى الإدخال ومستوى الخرج."],
 objectivesEn:["Understand Gain, EQ, Aux and Fader.","Understand signal flow.","Distinguish input and output levels."],
 quiz:[
  {qAr:"ما الوظيفة الأساسية لـ Gain؟",qEn:"What is the main purpose of Gain?",optionsAr:["ضبط مستوى الإشارة الداخلة","ضبط إضاءة المسرح","تغيير قطبية الكهرباء"],optionsEn:["Set the input signal level","Control stage lighting","Change mains polarity"],answer:0,whyAr:"Gain يضبط مستوى مرحلة الإدخال.",whyEn:"Gain adjusts the input stage level."}
 ]
},
{
 id:"D001",college:"dynacord",level:3,duration:35,
 ar:"مقدمة إلى Dynacord CMS",en:"Introduction to Dynacord CMS",
 bodyAr:[
  "سلسلة CMS من Dynacord هي عائلة مكسرات صوتية. تختلف الخصائص والوظائف بحسب رقم الموديل وإصدار الجهاز.",
  "قبل توصيل أي جهاز، تحقق من دليل التشغيل الخاص بالموديل، وحدد نوع المداخل والمخارج والتغذية الكهربائية ومسارات الإشارة.",
  "في هذا المساق سنبني دروساً منفصلة للموديلات المختلفة، ولن نفترض أن جميع أجهزة CMS لها الواجهة أو الوظائف نفسها."
 ],
 bodyEn:[
  "Dynacord CMS is a family of audio mixers. Features and functions vary by model and hardware revision.",
  "Before connecting equipment, consult the exact model's operating manual and identify its inputs, outputs, power requirements and signal paths.",
  "This course will create separate lessons for individual models rather than assuming every CMS unit has the same controls."
 ],
 objectivesAr:["فهم ضرورة تحديد الموديل.","الرجوع إلى الدليل الرسمي.","تمييز العائلة عن خصائص الجهاز المحدد."],
 objectivesEn:["Identify the exact model.","Consult the official manual.","Distinguish product family from model-specific features."],
 quiz:[
  {qAr:"هل يجوز افتراض أن جميع موديلات CMS متطابقة؟",qEn:"Can all CMS models be assumed to be identical?",optionsAr:["لا، يجب مراجعة دليل الموديل","نعم، جميعها متطابقة","نعم إذا كان لونها واحداً"],optionsEn:["No, check the exact model manual","Yes, all are identical","Yes, if they have the same colour"],answer:0,whyAr:"تختلف الخصائص والتوصيلات حسب الموديل.",whyEn:"Features and connections vary by model."}
 ]
},
{
 id:"D002",college:"dynacord",level:3,duration:35,
 ar:"مقدمة إلى Dynacord PowerMate",en:"Introduction to Dynacord PowerMate",
 bodyAr:[
  "PowerMate عائلة من المكسرات المزودة بمضخم قدرة مدمج في موديلات محددة. لذلك يجب التمييز بين مخارج الإشارة ومخارج السماعات ذات القدرة.",
  "تختلف القدرة والممانعة والتوصيلات وطرق التشغيل بين الموديلات. لا توصل سماعة بمخرج قبل التأكد من نوع المخرج ومواصفاته.",
  "التدريب المتقدم يجب أن يعتمد على دليل الموديل المحدد ومخطط التوصيل الرسمي."
 ],
 bodyEn:[
  "PowerMate is a family that includes powered mixer models with an integrated power amplifier. Distinguish line-level outputs from powered loudspeaker outputs.",
  "Power, impedance, connectors and operating modes vary by model. Never connect a loudspeaker until the output type and specifications are confirmed.",
  "Advanced training must be based on the exact model's manual and official connection diagrams."
 ],
 objectivesAr:["فهم فكرة Powered Mixer.","التمييز بين Line Out وSpeaker Out.","التحقق من القدرة والممانعة."],
 objectivesEn:["Understand powered mixers.","Distinguish line and speaker outputs.","Verify power and impedance."],
 quiz:[
  {qAr:"ما الخطر في الخلط بين Line Out وSpeaker Out؟",qEn:"What is the danger of confusing Line Out and Speaker Out?",optionsAr:["قد يحدث توصيل غير صحيح أو تلف للمعدات","لا يوجد أي اختلاف","يتغير لون الصوت فقط"],optionsEn:["Incorrect connection or equipment damage may occur","There is no difference","Only the sound colour changes"],answer:0,whyAr:"مستوى الإشارة وطبيعة الخرج مختلفان.",whyEn:"The signal level and output function are different."}
 ]
},
{
 id:"P001",college:"processing",level:4,duration:30,
 ar:"المعادل الصوتي EQ",en:"Equalization",
 bodyAr:[
  "المعادل EQ يسمح بتغيير مستوى نطاقات ترددية محددة.",
  "استخدم الاستماع والقياس معاً. لا توجد قاعدة تقول إن كل صوت يحتاج إلى رفع Bass أو خفض Treble.",
  "ابدأ بتحديد المشكلة، ثم استخدم أقل تعديل يحقق الهدف، وانتبه إلى تأثير التعديلات المتراكمة."
 ],
 bodyEn:[
  "An equalizer changes the level of selected frequency ranges.",
  "Use listening and measurement together. There is no universal rule that every source needs more bass or less treble.",
  "Identify the problem first, then apply the smallest useful adjustment and consider cumulative changes."
 ],
 objectivesAr:["فهم وظيفة EQ.","التفريق بين الترددات.","اتباع منهجية تعديل آمنة."],
 objectivesEn:["Understand EQ.","Recognize frequency ranges.","Use a disciplined adjustment method."],
 quiz:[
  {qAr:"ما أفضل نقطة بداية عند استخدام EQ؟",qEn:"What is the best starting point for EQ?",optionsAr:["تحديد المشكلة أولاً","رفع جميع الترددات","خفض جميع الترددات"],optionsEn:["Identify the problem first","Boost every frequency","Cut every frequency"],answer:0,whyAr:"يجب أن يكون التعديل مرتبطاً بهدف واضح.",whyEn:"Every adjustment should solve an identified problem."}
 ]
},
{
 id:"P002",college:"processing",level:4,duration:35,
 ar:"الضغط الديناميكي Compressor",en:"Dynamic Compression",
 bodyAr:[
  "Compressor يقلل تغيرات مستوى الإشارة عندما تتجاوز عتبة Threshold وفق إعداداته.",
  "من أهم المعاملات Threshold وRatio وAttack وRelease وKnee وMake-up Gain.",
  "الإعداد الخاطئ قد يجعل الصوت مسطحاً أو يسبب ضخاً مسموعاً. ابدأ بإعدادات معتدلة واستمع إلى النتيجة."
 ],
 bodyEn:[
  "A compressor reduces signal-level variation when the signal crosses a threshold, according to its settings.",
  "Key parameters include Threshold, Ratio, Attack, Release, Knee and Make-up Gain.",
  "Poor settings can make audio sound lifeless or cause audible pumping. Start moderately and listen."
 ],

 quiz:[
  {qAr:"ماذا يحدد Threshold؟",qEn:"What does Threshold determine?",optionsAr:["المستوى الذي يبدأ عنده الضغط","سرعة انتشار الصوت","ممانعة السماعة"],optionsEn:["The level at which compression begins","Speed of sound","Speaker impedance"],answer:0,whyAr:"يحدد Threshold مستوى بدء عمل الضغط.",whyEn:"Threshold sets the level where compression begins."}
 ]
},
{
 id:"G001",college:"digital",level:5,duration:40,
 ar:"مبادئ المكسر الرقمي",en:"Digital Mixer Fundamentals",
 bodyAr:[
  "المكسر الرقمي يعالج الإشارات رقمياً ويتيح إمكانات توجيه ومعالجة وتخزين إعدادات تختلف حسب الطراز.",

  "A digital mixer processes signals digitally and provides routing, processing and storage features that vary by model.",

 ]
},
{
 id:"S001",college:"speakers",level:5,duration:35,
 ar:"مبادئ السماعات",en:"Loudspeaker Fundamentals",
 bodyAr:[
  "السماعة تحول الطاقة الكهربائية إلى طاقة صوتية. يجب مطابقة السماعة ومكبر القدرة وفق القدرة والممانعة والحساسية وحدود التشغيل.",
  "قيمة Watt وحدها لا تكفي للمقارنة؛ تحقق من طريقة تصنيف القدرة ومن SPL والحساسية والاستجابة الترددية.",
  "في السماعات الفعالة Active يكون مضخم القدرة مدمجاً عادةً، بينما تحتاج السماعة السلبية Passive إلى مضخم خارجي مناسب."
 ],
 bodyEn:[
  "A loudspeaker converts electrical energy into acoustic energy. Match the loudspeaker and amplifier using power, impedance, sensitivity and operating limits.",
  "Wattage alone is not enough for comparison. Check the power rating method, SPL, sensitivity and frequency response.",
  "Active loudspeakers usually contain an integrated amplifier, while passive loudspeakers require a suitable external amplifier."
 ],
 objectivesAr:["التمييز بين Active وPassive.","فهم القدرة والممانعة.","معرفة حدود مقارنة السماعات."],
 objectivesEn:["Differentiate active and passive speakers.","Understand power and impedance.","Know the limits of loudspeaker comparisons."],
 quiz:[
  {qAr:"ماذا تحتاج السماعة السلبية عادةً؟",qEn:"What does a passive loudspeaker usually need?",optionsAr:["مضخم قدرة خارجي مناسب","بطارية هاتف","كابل شبكة فقط"],optionsEn:["A suitable external power amplifier","A phone battery","Only a network cable"],answer:0,whyAr:"السماعة السلبية لا تحتوي عادةً على مضخم مدمج.",whyEn:"A passive loudspeaker usually has no built-in amplifier."}
 ]
},
{
 id:"E001",college:"systems",level:6,duration:40,
 ar:"تخطيط النظام الصوتي",en:"Sound System Planning",
 bodyAr:[
  "يبدأ تصميم النظام بتحديد استخدام المكان وأبعاده وارتفاعه وعدد المستمعين والضوضاء المحيطة ومتطلبات التغطية.",
  "يجب تحديد مناطق التغطية ومواقع السماعات ونقاط التحكم ومسارات الكابلات ومصادر الطاقة.",
  "لا تعتمد على عدد السماعات وحده؛ فالتوزيع والاتجاه والمسافة والتداخل والانعكاسات تؤثر في النتيجة."
 ],
 bodyEn:[
  "System design begins with the venue use, dimensions, height, audience size, ambient noise and coverage requirements.",
  "Define coverage zones, loudspeaker positions, control points, cable routes and power sources.",
  "Do not rely on speaker count alone. Distribution, aiming, distance, interference and reflections affect performance."
 ],
 objectivesAr:["جمع بيانات الموقع.","تحديد مناطق التغطية.","إعداد مخطط أولي للنظام."],
 objectivesEn:["Collect venue data.","Define coverage zones.","Prepare a preliminary system layout."],
 quiz:[
  {qAr:"ما أول خطوة في تخطيط النظام؟",qEn:"What is the first step in system planning?",optionsAr:["فهم المكان واحتياجاته","شراء أكبر مضخم","رفع الصوت إلى الحد الأقصى"],optionsEn:["Understand the venue and its needs","Buy the largest amplifier","Turn everything to maximum"],answer:0,whyAr:"التصميم يبدأ بمتطلبات الموقع وليس بشراء الأجهزة.",whyEn:"Design begins with venue requirements, not equipment purchases."}
 ]
},
{
 id:"R001",college:"acoustics",level:6,duration:35,
 ar:"الصدى والانعكاسات",en:"Reverberation & Reflections",
 bodyAr:[
  "تنعكس الموجات الصوتية عند اصطدامها بالأسطح. تتأثر النتيجة بحجم المكان وشكل الأسطح وموادها.",
  "قد يؤدي زمن الارتداد الطويل إلى ضعف وضوح الكلام، خصوصاً في القاعات الكبيرة أو كثيرة الأسطح العاكسة.",
  "المعالجة الصوتية ليست مجرد وضع إسفنج عشوائي؛ بل تحتاج إلى فهم نطاقات التردد ومواضع الانعكاس والهدف المطلوب."
 ],
 bodyEn:[
  "Sound waves reflect when they encounter surfaces. The result depends on room size, geometry and materials.",
  "Long reverberation can reduce speech intelligibility, especially in large or highly reflective rooms.",
  "Acoustic treatment is not simply placing foam randomly. It requires understanding frequency ranges, reflection points and the intended outcome."
 ],
 objectivesAr:["شرح الانعكاس.","فهم أثر زمن الارتداد.","تمييز المعالجة عن العزل."],

 quiz:[
  {qAr:"ما أثر الارتداد الطويل على الكلام غالباً؟",qEn:"What is a common effect of long reverberation on speech?",optionsAr:["انخفاض وضوح الكلام","زيادة وضوح كل الكلمات","إلغاء الضوضاء تماماً"],optionsEn:["Reduced speech intelligibility","Improved intelligibility of every word","Complete noise cancellation"],answer:0,whyAr:"تداخل الانعكاسات قد يقلل وضوح الكلام.",whyEn:"Overlapping reflections can reduce speech intelligibility."}
 ]
},
{

 ar:"إعداد فعالية صوتية",en:"Preparing a Live Event",
 bodyAr:[
  "ابدأ بملف متطلبات الفعالية: نوعها، عدد الجمهور، البرنامج، مصادر الصوت، المسرح، مناطق التغطية، ومتطلبات التسجيل أو البث.",

 ],

  "Start with an event brief: event type, audience size, programme, audio sources, stage, coverage zones and recording or broadcast needs.",
  "Prepare an input list, stage plot and patch list. Verify power, cables, stands and rigging safety.",
  "Perform a line check for every channel, then soundcheck, and monitor signal levels and feedback during the show."
 ],
 objectivesAr:["إعداد Input List.","فهم Stage Plot وPatch List.","تنظيم Line Check وSound Check."],

  {qAr:"ما الهدف من Line Check؟",qEn:"What is the purpose of a line check?",optionsAr:["التأكد من وصول الإشارة عبر كل مسار","اختيار لون الستارة","تحديد عدد المقاعد"],optionsEn:["Verify signal through each path","Choose curtain colour","Count seats"],answer:0,whyAr:"يفحص Line Check سلامة مسار الإشارة قبل العرض.",whyEn:"A line check verifies signal paths before the show."}
 ]
},
{
 id:"MS001",college:"venues",level:7,duration:45,
 ar:"تصميم نظام صوت مسجد",en:"Mosque Sound System Design",
 bodyAr:[
  "يجب تقسيم المسجد إلى مناطق: المصلى الرئيسي، مصلى النساء، المداخل، الساحات، وأي ملاحق صوتية.",
  "يختلف اختيار السماعات بين السماعات السقفية والجدارية والبوقية والخطية بحسب المسافة والارتفاع والبيئة.",
  "الأولوية لوضوح الكلام وتجانس التغطية والتحكم المستقل بالمناطق، مع مراعاة التغذية الاحتياطية وسلامة التوصيلات.",

 ],

  "Divide the mosque into zones: main prayer hall, women's area, entrances, courtyards and other audio spaces.",
  "Ceiling, wall-mounted, horn and column loudspeakers serve different distances, heights and environments.",
  "Prioritize speech intelligibility, even coverage and independent zone control, while considering backup power and safe wiring.",
  "Measure the installed system and adjust zone levels and delays where necessary."
 ],

 quiz:[
  {qAr:"ما الهدف الأهم في نظام خطبة المسجد؟",qEn:"What is a key priority for mosque sermon sound?",optionsAr:["وضوح الكلام وتجانس التغطية","أعلى Bass ممكن","تشغيل كل المناطق بنفس المستوى دائماً"],optionsEn:["Speech intelligibility and even coverage","Maximum possible bass","Always running every zone at the same level"],answer:0,whyAr:"وضوح الكلام هو أساس نجاح نظام الخطبة.",whyEn:"Speech intelligibility is central to sermon sound."}
 ]
},
{
 id:"H001",college:"venues",level:7,duration:40,
 ar:"أنظمة القاعات والمؤتمرات",en:"Halls & Conference Systems",
 bodyAr:[
  "ابدأ بتحديد عدد المتحدثين ومواقعهم ونوع الجلسة والحاجة إلى النقاش أو التصويت أو الترجمة أو التسجيل.",

 ],
 bodyEn:[

 ],

 quiz:[
  {qAr:"ما الذي يجب تحليله قبل اختيار نظام المؤتمر؟",qEn:"What should be analyzed before choosing a conference system?",optionsAr:["عدد المتحدثين وطبيعة الاجتماع","لون الجدران فقط","نوع أرضية المدخل فقط"],optionsEn:["Number of speakers and meeting format","Wall colour only","Entrance floor type only"],answer:0,whyAr:"عدد المتحدثين وطبيعة الجلسة يحددان متطلبات النظام.",whyEn:"Speaker count and meeting format determine system requirements."}
 ]
},
{
 id:"N001",college:"network",level:8,duration:40,
 ar:"مقدمة إلى الصوت الشبكي",en:"Network Audio Introduction",
 bodyAr:[
  "تسمح أنظمة الصوت الشبكي بنقل قنوات صوتية عبر بنية شبكة بيانات وفق بروتوكولات محددة.",

  {qAr:"هل كل جهاز يحتوي على منفذ Ethernet يدعم Dante؟",qEn:"Does every device with an Ethernet port support Dante?",optionsAr:["لا، يجب التحقق من دعم البروتوكول","نعم دائماً","فقط إذا كان الكابل أزرق"],optionsEn:["No, verify protocol support","Yes, always","Only if the cable is blue"],answer:0,whyAr:"منفذ Ethernet لا يعني تلقائياً دعم Dante.",whyEn:"An Ethernet port does not automatically mean Dante support."}

function navigate(page){
  currentPage=page;
  document.querySelectorAll(".nav-btn").forEach(b=>{
    b.classList.toggle("active",b.dataset.page===page);
  });
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}
function getLesson(id){return lessons.find(x=>x.id===id);}
function getCollege(id){return colleges.find(x=>x.id===id);}
function localized(obj,key){
  return obj[(key||"")+(state.language==="ar"?"Ar":"En")] || "";
}
function completionRate(){
  return lessons.length ? Math.round(state.completed.length/lessons.length*100) : 0;
}

function openLesson(id){
 currentLessonId=id;quizAnswers={};
 const l=getLesson(id);
 if(!l)return;
 const body=state.language==="ar"?l.bodyAr:l.bodyEn;
 const objectives=state.language==="ar"?l.objectivesAr:l.objectivesEn;
 const quiz=l.quiz||[];
 document.getElementById("pageContent").innerHTML=`
 <div class="lesson-content">
 <button class="btn" onclick="openCollege('${l.college}')">← ${t("عودة إلى التخصص","Back to Discipline")}</button>
 <div class="section-head"><span class="tag">${l.id} · ${t("المستوى","Level")} ${l.level}</span><span class="muted">${l.duration} ${t("دقيقة","min")}</span></div>
 <h2>${esc(state.language==="ar"?l.ar:l.en)}</h2>
 <div class="card">
  <h3>${t("أهداف التعلم","Learning Objectives")}</h3>
  <ul>${objectives.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
 </div>
 <div class="card" style="margin-top:14px">
  ${body.map(p=>`<p>${esc(p)}</p>`).join("")}
 </div>
 <div class="callout">${t("ملاحظة تدريبية: اقرأ المحتوى ثم أجب عن الاختبار. لا تعتمد على الحفظ وحده؛ حاول ربط المفاهيم بالمعدات الحقيقية.","Training note: Read the lesson and complete the quiz. Do not rely on memorization alone; connect the concepts to real equipment.")}</div>
 ${quiz.length?`
 <div class="section-head"><h3>${t("اختبار الدرس","Lesson Quiz")}</h3></div>
 <div id="quizArea">${quiz.map((q,i)=>`
 <div class="card" style="margin-bottom:12px">
  <strong>${i+1}. ${esc(state.language==="ar"?q.qAr:q.qEn)}</strong>
  ${(state.language==="ar"?q.optionsAr:q.optionsEn).map((o,j)=>`
   <button class="quiz-option" id="q${i}o${j}" onclick="chooseAnswer(${i},${j})">${esc(o)}</button>
  `).join("")}
  <div id="q${i}feedback" class="muted"></div>
 </div>`).join("")}
 <button class="btn primary" onclick="submitQuiz('${l.id}')">${t("تصحيح الاختبار","Submit Quiz")}</button>
 <div id="quizResult"></div>
 </div>`:`<div class="callout">${t("لا يوجد اختبار لهذا الدرس حالياً.","No quiz is available for this lesson yet.")}</div>`}
 </div>`;
}
function chooseAnswer(qi,oi){
 quizAnswers[qi]=oi;
 const l=getLesson(currentLessonId);
 l.quiz[qi].optionsAr.forEach((_,j)=>{
  const el=document.getElementById(`q${qi}o${j}`);
  if(el)el.classList.toggle("selected",j===oi);
 });
}
function submitQuiz(id){
 const l=getLesson(id);
 const total=l.quiz.length;
 if(Object.keys(quizAnswers).length!==total){
  alert(t("أجب عن جميع الأسئلة أولاً.","Answer all questions first."));
  return;
 }
 let score=0;
 l.quiz.forEach((q,i)=>{
  const correct=quizAnswers[i]===q.answer;
  if(correct)score++;
  const chosen=document.getElementById(`q${i}o${quizAnswers[i]}`);
  const right=document.getElementById(`q${i}o${q.answer}`);
  if(chosen)chosen.classList.add(correct?"correct":"wrong");
  if(right)right.classList.add("correct");
  const feedback=document.getElementById(`q${i}feedback`);
  feedback.textContent=(correct?"✓ ":"✕ ")+(state.language==="ar"?q.whyAr:q.whyEn);
 });
 const percent=Math.round(score/total*100);
 state.attempts[id]=(state.attempts[id]||0)+1;
 state.scores[id]=Math.max(state.scores[id]||0,percent);
 if(percent>=70&&!state.completed.includes(id))state.completed.push(id);
 saveState();
 document.getElementById("quizResult").innerHTML=`
 <div class="callout">
  <strong>${t("نتيجتك:","Your score:")} ${percent}%</strong><br>
  ${percent>=70?t("أحسنت! اجتزت الاختبار وأصبح الدرس مكتملاً.","Well done! You passed and the lesson is complete."):t("لم تصل إلى 70%. راجع الدرس وحاول مرة أخرى.","You scored below 70%. Review the lesson and try again.")}
 </div>
 <button class="btn" onclick="navigate('progress')">${t("عرض تقدمي","View Progress")}</button>`;
}

function renderLab(){
 const m=state.mixer;
 return `
 <div class="section-head"><h2>${t("مختبر المكسر التناظري","Analog Mixer Lab")}</h2><span class="tag">${t("محاكاة تعليمية","Educational Simulation")}</span></div>
 <p class="muted">${t("جرّب تغيير إعدادات القناة ولاحظ كيف تتغير قراءة النموذج التعليمي لمسار الإشارة. هذه ليست معالجة صوت حقيقية ولا تمثل لوحة مكسر بعينها.","Change channel settings and observe the educational signal-path model. This is not real audio processing and does not represent a specific console.")}</p>
 <div class="card">
  <div class="toolbar"><strong>${t("القناة الأولى · ميكروفون افتراضي","Channel 1 · Virtual Microphone")}</strong><span class="tag">${t("Mono Input","Mono Input")}</span></div>
  <div class="lab-grid" style="margin-top:15px">
   ${renderMixerControl("gain",t("Gain","Gain"),-20,40,1,"dB")}
   ${renderMixerControl("high",t("High EQ","High EQ"),-15,15,1,"dB")}
   ${renderMixerControl("mid",t("Mid EQ","Mid EQ"),-15,15,1,"dB")}
   ${renderMixerControl("low",t("Low EQ","Low EQ"),-15,15,1,"dB")}
   ${renderMixerControl("aux",t("Aux Send","Aux Send"),0,100,1,"%")}
   ${renderMixerControl("fader",t("Channel Fader","Channel Fader"),-60,10,1,"dB")}
  </div>
  <div class="signal-box">
   <h3>${t("مؤشر مستوى الإشارة الافتراضي","Virtual Signal Meter")}</h3>
   <div class="meter"><div class="meter-fill" id="signalMeter" style="width:${meterValue()}%"></div></div>
   <div class="toolbar" style="justify-content:space-between">
    <span>${t("مستوى النموذج","Model Level")}</span><strong id="meterLabel">${meterValue()}%</strong>
   </div>
   <div class="signal-flow" style="margin-top:15px">
    <span class="signal-node">INPUT</span><span class="signal-arrow">→</span>
    <span class="signal-node">GAIN</span><span class="signal-arrow">→</span>
    <span class="signal-node">EQ</span><span class="signal-arrow">→</span>
    <span class="signal-node">FADER</span><span class="signal-arrow">→</span>
    <span class="signal-node">MAIN MIX</span>
   </div>
   <p class="muted" id="labExplanation">${labExplanation()}</p>
  </div>
  <button class="btn" style="margin-top:14px" onclick="resetMixer()">${t("إعادة إعدادات المختبر","Reset Lab")}</button>
 </div>
 <div class="section-head"><h3>${t("تمرين عملي","Practical Exercise")}</h3></div>
 <div class="card">
  <p>${t("اضبط Gain على مستوى معتدل، واترك EQ على الصفر، ثم ارفع Fader تدريجياً. راقب المؤشر ولا ترفع جميع الإعدادات إلى أقصى حد.","Set Gain moderately, leave EQ flat, then raise the fader gradually. Watch the meter and avoid setting every control to maximum.")}</p>
  <p class="muted">${t("تذكّر: في المكسر الحقيقي يجب مراقبة مؤشرات Peak وقياس الإشارة والاستماع إليها، وليس الاعتماد على هذا المؤشر الافتراضي.","Remember: on a real mixer, monitor peak indicators, measure the signal and listen. Do not rely on this virtual meter.")}</p>
 </div>`;
}
function renderMixerControl(key,label,min,max,step,unit){
 const value=state.mixer[key];
 return `<div class="channel">
  <h3>${label}</h3>
  <div class="knob" id="knob-${key}">${value}${unit}</div>
  <div class="control">
   <label><span>${min}${unit}</span><strong>${label}</strong><span>${max}${unit}</span></label>
   <input type="range" min="${min}" max="${max}" step="${step}" value="${value}" oninput="updateMixer('${key}',this.value)">
  </div>
 </div>`;
}
function meterValue(){
 const m=state.mixer;
 const raw=45 + m.gain*1.1 + m.fader*1.0 + (m.high+m.mid+m.low)*0.35;
 return Math.max(0,Math.min(100,Math.round(raw)));
}
function labExplanation(){
 const value=meterValue();
 if(value>85)return t("المستوى الافتراضي مرتفع جداً. في الواقع افحص احتمال clipping وخفّض مستوى الإشارة عند المرحلة المناسبة.","The virtual level is very high. In practice, check for clipping and reduce level at the appropriate stage.");
 if(value<20)return t("المستوى الافتراضي منخفض. تحقق من Gain ومسار الإشارة ومستوى Fader.","The virtual level is low. Check gain, signal path and fader.");
 return t("المستوى الافتراضي ضمن النطاق المتوسط في هذا النموذج التعليمي.","The virtual level is within the middle range of this educational model.");
}
function updateMixer(key,value){
 state.mixer[key]=Number(value);
 saveState();
 const knob=document.getElementById("knob-"+key);
 if(knob)knob.textContent=value+(key==="aux"?"%":"dB");
 const meter=document.getElementById("signalMeter");
 const label=document.getElementById("meterLabel");
 const explanation=document.getElementById("labExplanation");
 if(meter)meter.style.width=meterValue()+"%";
 if(label)label.textContent=meterValue()+"%";
 if(explanation)explanation.textContent=labExplanation();
}
function resetMixer(){
 state.mixer={...defaultState.mixer};
 saveState();render();
}
